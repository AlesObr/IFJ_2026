<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DKA lexeru IFJ26</title>
<!-- Sablona prohlizecky; vyplnuje ji test/formal_verify/lexer_dka.py do docs/dka/index.html. -->
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --canvas: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
  --line: #dddbd3; --accent: #1f5fbf; --accent-soft: #e3ecfa; --err: #c62828; --final: #2e7d32;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --surface: #1d1f24; --canvas: #1d1f24; --ink: #e8e6e0; --muted: #9a988f;
    --line: #34363d; --accent: #7aa7ff; --accent-soft: #24324d; --err: #ff7a70; --final: #7bc77f;
  }
}
:root[data-theme="dark"] {
  --bg: #15161a; --surface: #1d1f24; --canvas: #1d1f24; --ink: #e8e6e0; --muted: #9a988f;
  --line: #34363d; --accent: #7aa7ff; --accent-soft: #24324d; --err: #ff7a70; --final: #7bc77f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
         border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; white-space: nowrap; }
nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
nav a { padding: 4px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
nav a:hover { color: var(--ink); background: var(--bg); }
nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.search { position: relative; }
.search input { font: 13px var(--mono); padding: 5px 9px; width: 190px; border: 1px solid var(--line);
                border-radius: 6px; background: var(--bg); color: var(--ink); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
main { flex: 1; display: flex; min-height: 0; }
.stage { flex: 1; position: relative; min-width: 0; background: var(--canvas); }
.diagram { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; }
.diagram.dragging { cursor: grabbing; }
.diagram svg { width: 100%; height: 100%; display: block; user-select: none; }
.tools { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
.tools button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
                background: var(--surface); color: var(--ink); font: 16px var(--sans); }
.tools button:hover { border-color: var(--accent); color: var(--accent); }
aside { width: 340px; flex: none; overflow: auto; border-left: 1px solid var(--line); background: var(--surface);
        padding: 16px; }
aside h2 { font: 600 17px var(--mono); margin: 0 0 6px; word-break: break-all; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
           margin: 18px 0 6px; font-weight: 600; }
aside p { margin: 6px 0; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; border: 1px solid currentColor; }
.badge.final { color: var(--final); } .badge.err { color: var(--err); } .badge.plain { color: var(--muted); }
.muted { color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
td.chars { font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
td.cond { color: var(--muted); font-size: 12px; }
tr.error td { color: var(--err); }
a { color: var(--accent); }
.copy { display: flex; gap: 6px; margin-top: 6px; }
.copy input { flex: 1; min-width: 0; font: 12px var(--mono); padding: 4px 6px; border: 1px solid var(--line);
              border-radius: 5px; background: var(--bg); color: var(--ink); }
.copy button { font-size: 12px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
               background: var(--surface); color: var(--ink); }
ul.legend { padding-left: 18px; margin: 6px 0; } ul.legend li { margin: 3px 0; }
footer { font-size: 12px; color: var(--muted); margin-top: 18px; }

/* Graphviz SVG: barvy z tokenu, aby diagram fungoval i v tmavem rezimu */
.diagram svg polygon[fill="white"] { fill: var(--canvas); }
.diagram svg [stroke="black"] { stroke: var(--ink); }
.diagram svg [fill="black"] { fill: var(--ink); }
.diagram svg text:not([fill]) { fill: var(--ink); }
.diagram svg [stroke="red"] { stroke: var(--err); }
.diagram svg [fill="red"] { fill: var(--err); }
.diagram svg text[fill="#4d4d4d"] { fill: var(--muted); }
.diagram svg .node a, .diagram svg .cluster a { cursor: pointer; }
.diagram svg .node:hover ellipse { stroke: var(--accent); }
.diagram svg .node, .diagram svg .edge { transition: opacity .15s; }
.diagram svg.focus .node, .diagram svg.focus .edge { opacity: .22; }
.diagram svg.focus .hl { opacity: 1; }
.diagram svg .node.sel ellipse { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
.diagram svg .edge.out path, .diagram svg .edge.out polygon { stroke: var(--accent); stroke-width: 2; }
.diagram svg .edge.out polygon { fill: var(--accent); }
.diagram svg .edge.out text { fill: var(--accent); font-weight: 600; }

@media (max-width: 760px) {
  main { flex-direction: column; }
  .stage { min-height: 60vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  .search input { width: 100%; }
  .search { flex: 1 1 100%; }
}
</style>

function stateRef(name) {
  const st = DKA.states[name];
  if (st.error) return `<span class="mono" style="color:var(--err)">chyba 1</span>`;
  return `<a class="mono" href="${link(stateView(name), name)}">${esc(name)}</a>`;
}
function edgeRows(list, other) {
  if (!list.length) return `<p class="muted">žádné</p>`;
  return "<table>" + list.map(e => {
    const cond = [e.guard, e.action].filter(Boolean).map(esc).join("<br>");
    return `<tr class="${e.error ? "error" : ""}"><td class="chars">${esc(e.label)}</td>` +
           `<td class="cond">${cond}</td><td>${stateRef(other(e))}</td></tr>`;
  }).join("") + "</table>";
}
function renderPanel() {
  const { view, state } = current;
  if (!state) {
    const members = Object.entries(DKA.states).filter(([n, s]) => view === "all" || s.cluster === view);
    const finals = members.filter(([, s]) => s.token).length;
    panel.innerHTML = `
      <h2 style="font-family:var(--sans)">${esc(titles[view])}</h2>
      <p class="muted">${members.length} stavů, z toho ${finals} koncových. Klikni na stav (v přehledu i na rámeček části).</p>
      <h3>Konvence</h3>
      <ul class="legend">
        <li>Dvojitý kruh je koncový stav, v závorce token, který se v něm přijme.</li>
        <li>Chybějící přechod z koncového stavu: token se přijme a znak se vrátí.</li>
        <li>Chybějící přechod z nekoncového stavu: lexikální chyba 1.</li>
        <li><code>[podmínka]</code> a <code>/ akce</code>: kontext mimo konečný automat (vnoření komentářů, pohled na další znak).</li>
        <li>INDENT/OUTDENT generuje vrstva nad automatem se zásobníkem úrovní.</li>
      </ul>
      <h3>Ovládání</h3>
      <p class="muted">Kolečko přibližuje, tažením se posouvá, <code>0</code> celý diagram, <code>/</code> hledání, <code>Esc</code> zruší výběr.</p>
      ${copyBox(link(view))}
      <footer>Vygenerováno ${esc(DKA.generated)} z test/formal_verify/lexer_dka.py, ověřeno proti skutečnému lexeru.</footer>`;
    return;
  }
  const st = DKA.states[state];
  const out = DKA.edges.filter(e => e.src === state), inc = DKA.edges.filter(e => e.dst === state);
  const kind = st.error ? `<span class="badge err">chybový</span>`
             : st.token ? `<span class="badge final">koncový → ${esc(st.token)}</span>`
             : `<span class="badge plain">nekoncový</span>`;
  const fallback = st.error ? "" : st.token
    ? (st.rejectNext ? "Znak z výčtu výše: lexikální chyba 1. Jiný znak: token se přijme a znak se vrátí do vstupu."
                     : "Jiný znak: token se přijme a znak se vrátí do vstupu.")
    : "Jiný znak: lexikální chyba 1.";
  panel.innerHTML = `
    <h2>${esc(state)}</h2>
    <p>${kind} <a href="${link(st.cluster)}">${esc(titles[st.cluster])}</a></p>
    ${st.note ? `<p class="muted">${esc(st.note)}</p>` : ""}
    ${st.resume ? `<p class="muted">Po přijetí tokenu pokračuje další token ve stavu ${stateRef(st.resume)}.</p>` : ""}
    <h3>Přechody ven</h3>${edgeRows(out, e => e.dst)}
    ${fallback ? `<p class="muted">${fallback}</p>` : ""}
    <h3>Přechody dovnitř</h3>${edgeRows(inc, e => e.src)}
    ${copyBox(link(stateView(state), state), state)}`;
}
function copyBox(hash, state) {
  const url = location.href.split("#")[0] + hash;
  const tex = state ? `\\dkastate{${stateView(state)}}{${state}}{${state}}` : `\\dkapart{${hash.slice(1)}}{…}`;
  return `<h3>Odkaz do dokumentace</h3>
    <div class="copy"><input readonly value="${esc(url)}" aria-label="URL"><button type="button" data-copy="${esc(url)}">Kopírovat</button></div>
    <div class="copy"><input readonly value="${esc(tex)}" aria-label="LaTeX"><button type="button" data-copy="${esc(tex)}">LaTeX</button></div>`;
}
panel.addEventListener("click", e => {
  const b = e.target.closest("button[data-copy]");
  if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => { b.textContent = "Hotovo"; setTimeout(() => b.textContent = b.dataset.copy.startsWith("\\") ? "LaTeX" : "Kopírovat", 1200); });
});

/* ------------------------------------------------------------------ routing */
function route() {
  const next = parseHash();
  if (next.view !== current.view) {
    mount(next.view);
    document.querySelectorAll("nav a").forEach(a => {
      if (a.dataset.view === next.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }
  current = next;
  document.title = "DKA lexeru IFJ26 – " + (next.state || titles[next.view]);
  highlight(next.state);
  renderPanel();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
